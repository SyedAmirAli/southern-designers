<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Password Reset Code From - Pathgriho Foundation</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        box-sizing: border-box;
      }

      body {
        width: 100%;
      }

      .class__1 {
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: center;
        --tw-bg-opacity: 1;
        background-color: rgb(255 255 255 / var(--tw-bg-opacity));
        background-image: linear-gradient(
          to top right,
          var(--tw-gradient-stops)
        );
        --tw-gradient-from: rgb(6 182 212 / 0.1)
          var(--tw-gradient-from-position);
        --tw-gradient-to: rgb(6 182 212 / 0) var(--tw-gradient-to-position);
        --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to);
        --tw-gradient-to: rgb(255 255 255 / 0) var(--tw-gradient-to-position);
        --tw-gradient-stops: var(--tw-gradient-from),
          #fff var(--tw-gradient-via-position), var(--tw-gradient-to);
        --tw-gradient-to: rgb(168 85 247 / 0.1) var(--tw-gradient-to-position);
        padding: 1.5rem;
      }

      .class__2 {
        max-width: 36rem;
        border-radius: 1.5rem;
        border-width: 1px;
        border-style: solid;
        --tw-border-opacity: 1;
        border-color: rgb(203 213 225 / var(--tw-border-opacity));
        background-color: rgb(203 213 225 / 0.1);
        padding: 2.5rem;
        --tw-shadow: 0px 2px 4px 0px rgba (0, 0, 0, 0.12);
        --tw-shadow-colored: 0px 2px 4px 0px var(--tw-shadow-color);
        box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000),
          var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
      }

      .class__3 {
        text-align: center;
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 600;
        --tw-text-opacity: 1;
        color: rgb(1 152 219 / var(--tw-text-opacity));
      }

      .class__4 {
        margin-top: 1rem;
        margin-bottom: 1rem;
        width: 100%;
        border-width: 0px;
        border-top-width: 1px;
        border-style: solid;
        border-color: rgba(97, 97, 97, 0.3);
      }

      .class__5 {
        text-align: center;
        font-weight: 700;
        text-transform: capitalize;
      }

      .group.error .class__5 {
        --tw-text-opacity: 1;
        color: rgb(239 68 68 / var(--tw-text-opacity));
      }

      .group.success .class__5 {
        --tw-text-opacity: 1;
        color: rgb(34 197 94 / var(--tw-text-opacity));
      }

      .class__6 {
        margin-bottom: 0.5rem;
        text-align: center;
        font-size: 0.875rem;
        line-height: 1.25rem;
        --tw-text-opacity: 1;
        color: rgb(13 56 150 / var(--tw-text-opacity));
      }

      .class__7 {
        padding-left: 0.25rem;
        padding-right: 0.25rem;
        font-weight: 700;
        --tw-text-opacity: 1;
        color: rgb(1 152 219 / var(--tw-text-opacity));
      }

      .class__8 {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }

      .class__ {
        --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0
          var(--tw-ring-offset-width) var(--tw-ring-offset-color);
        --tw-ring-shadow: var(--tw-ring-inset) 0 0 0
          calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
        box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow),
          var(--tw-shadow, 0 0 #0000);
      }

      .class__9 {
        display: flex;
        height: 3rem;
        width: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.125rem;
        border-width: 1px;
        border-style: solid;
        --tw-border-opacity: 1;
        border-color: rgb(1 152 219 / var(--tw-border-opacity));
        padding: 0px;
        text-align: center;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        --tw-text-opacity: 1;
        color: rgb(1 152 219 / var(--tw-text-opacity));
      }

      .class__9::-moz-placeholder {
        --tw-text-opacity: 1;
        color: rgb(203 213 225 / var(--tw-text-opacity));
      }

      .class__9::placeholder {
        --tw-text-opacity: 1;
        color: rgb(203 213 225 / var(--tw-text-opacity));
      }
    </style>
  </head>
  <body>
    <main class="class__1">
      <article class="class__2">
        <h1 class="class__3">Password Reset Code</h1>

        <p class="class__4"></p>

        <form action="">
          <div class="mt-4">
            <div class="group success">
              <h3 class="class__5">Your Password Reset Code is here</h3>
              <p class="class__6">
                Thank you for joining our team
                <span class="class__7">Pathgriho Foundation</span>
                & stay.
              </p>
            </div>
            <div class="class__8" id="code-container">
              <p class="class__9">0</p>
              <p class="class__9">0</p>
              <p class="class__9">0</p>
              <p class="class__9">0</p>
              <p class="class__9">0</p>
              <p class="class__9">0</p>
            </div>
          </div>
        </form>
      </article>
    </main>
  </body>
</html>
